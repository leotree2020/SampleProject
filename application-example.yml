# =====================================================================
# iPhone Duo 库存监控 + 辅助抢购（日本 Apple Store）—— 配置示例
# ---------------------------------------------------------------------
# 使用方法：复制本文件为 application.yml 并修改后运行：
#   cp application-example.yml application.yml
# 敏感信息（邮箱密码、机器人 Token、代理账号）建议通过环境变量注入：
#   语法：${ENV_VAR} 或 ${ENV_VAR:默认值}
# =====================================================================

monitor:
  region: jp
  base-url: https://www.apple.com/jp
  buyability-path: /shop/buyability-message
  fulfillment-path: /shop/fulfillment-messages
  check-mode: buyability           # buyability(默认,只判断线上可购,最轻量) | fulfillment(含配送日期+门店取货,风控较严,被拦时会自动降级) | product-page(HTML兜底)
  postal-code: "100-0005"          # 你的日本邮编，用于查询配送日期与附近门店（例：东京站周边 100-0005）
  stores:                          # 门店号，用于查询到店取货（第一个为中心，附近门店会一并返回）
    - R079                         # Apple 銀座（其它门店号见 README「如何获取门店号」）
  interval:
    base-seconds: 5                # 基础检查间隔（秒）
    jitter-seconds: 3              # 随机抖动 ±（秒）
    min-seconds: 3                 # 间隔下限保护（秒）
  retry:
    max-attempts: 3
    backoff-base-ms: 1000
    backoff-multiplier: 2.0
    max-backoff-ms: 30000
  cooldown:
    error-threshold: 5             # 连续 N 轮全部失败后进入冷却
    after-consecutive-errors-ms: 120000
  concurrency: 2                   # 并发检查数（修改需重启），建议 1~3
  renotify-seconds: 300            # 0=只在「无货→有货」时提醒一次；>0=持续有货时按该秒数重复提醒

  # ===== 型号预设 =====
  active-model: iphone-duo         # 留空 = 启动时询问；也可用命令行 --model=iphone-duo 指定
  models:
    iphone-duo:
      name: "iPhone Duo"
      product-page-path: /shop/buy-iphone/iphone-duo
      # 固定监控并自动购买的配置：MK244J/A = スターホワイト 256GB（部件号来自官网）。
      # 想加其他颜色/容量时，复制下面一段，换成真实部件号后设 enabled: true。
      skus:
        - part-number: "MK244J/A"
          name: "iPhone Duo 256GB スターホワイト"
          color: "スターホワイト"
          capacity: "256GB"
          enabled: true
          # buy-url: "https://www.apple.com/jp/shop/buy-iphone/iphone-duo"  # 可选：有货时打开的自定义链接
    iphone-18-pro:
      name: "iPhone 18 Pro"
      product-page-path: /shop/buy-iphone/iphone-18-pro
      skus:
        - part-number: "MJR54J/A"      # 你提供的部件号（官网查到的真实值）
          name: "iPhone 18 Pro (MJR54J/A)"
          enabled: true

# ===== 有货后的辅助抢购 =====
purchase:
  auto-open-browser: true          # 有货时立刻用默认浏览器打开购买页（请提前登录 Apple ID）
  open-once-per-restock: true      # 每次「无货→有货」只打开一次，避免持续有货时反复弹页面
  max-tabs-per-round: 3            # 多个 SKU 同时到货时最多打开几个标签页
  stop-sku-after-hit: false        # 命中后停止监控该 SKU

  # ===== 自动结账（需先运行一次 --login，在弹出的浏览器里自己登录 Apple ID）=====
  # 程序不读取、不保存你的密码和银行卡；只是在你已登录的浏览器窗口里按下面的 steps 依次点击。
  # 遇到验证码 / 3D Secure 等环节，窗口会保持打开，由你接手。
  # ⚠️ Apple 条款禁止自动下单，可能导致订单被取消或账号被限购，风险自负。
  checkout:
    enabled: true                  # 总开关：true 才会在有货时自动结账（使用前先运行一次 --login 保存登录会话）
    auto-submit: false             # 到结算页面就停下，由你本人核对并下单；这里保持 false
    profile-dir: data/browser-profile   # 浏览器配置文件（保存登录会话），不要提交到 git
    headless: false                # 保持 false，方便你随时接手
    channel: ""                    # 可选：chrome / msedge，使用本机已安装的浏览器；留空用 Playwright 自带 Chromium
    executable-path: ""            # 可选：浏览器 exe 路径
    default-timeout-ms: 8000
    quantity: 1                    # unit-steps（选配流程）重复几遍。买 2 台时保持 1：选一次配置，再在购物袋页面把数量选成 2（见下面 steps）
    # 点击步骤。text 是正则，匹配按钮/选项上的文字；{color} {capacity} 取自 SKU 的 color / capacity 字段。
    # 某一步找不到按钮时，程序会截图并停下，浏览器窗口保持打开，由你接手。
    #
    # unit-steps：每台都走一遍（打开购买页 → 选配置 → 続ける），重复 quantity 遍。
    unit-steps:
      - action: goto               # 打开购买页
      - action: click              # 选颜色（SKU 里填 color，如 "ナイトスカイ"）
        text: "{color}"
      - action: click              # 选容量（SKU 里填 capacity，如 "256GB"）
        text: "{capacity}"
      - action: click              # 下取りを利用しない
        text: "下取りを利用しない"
      - action: click              # SIMフリー
        text: "SIMフリー"
      - action: click              # 一括あと払いプランApple専用
        text: "一括あと払いプラン"
      - action: click              # AppleCareによる保証を追加しない
        text: "AppleCareによる保証を追加しない"
      - action: click              # 続ける（进入结算页面）
        text: "続ける"
      - action: wait
        value: "1500"
    # steps：选完配置、进入购物袋/结算页面后只执行一次。默认只做一件事：把数量下拉框选成 2（同一账号最多买 2 台，
    # 只买 1 台就把 value 改成 "1" 或删掉这一步）。之后停在结算页面，由你自己核对并下单。
    # 找不到数量下拉框时，程序会截图并停下，由你手动改数量。
    # 标记 submit: true 的步骤只有在 auto-submit: true 时才会执行。
    steps:
      - action: select             # 购物袋里的「数量」下拉框，选 2
        selector: "select[name*='quantity' i], select[id*='quantity' i], select[aria-label*='数量'], select[aria-label*='quantity' i]"
        value: "2"

http:
  connect-timeout-seconds: 15
  read-timeout-seconds: 20
  write-timeout-seconds: 20
  max-idle-connections: 10
  keep-alive-minutes: 5
  user-agents: []                  # 留空则使用内置的 Chrome/Safari/Edge 桌面端 UA 列表
  extra-headers: {}                # 可选额外请求头

proxy:
  enabled: false                   # 是否启用代理（修改需重启）。在日本以外地区运行时建议使用日本节点
  rotate-strategy: round-robin     # round-robin | random
  proxies:                         # 支持 http 与 socks5，可带账号密码
    - "http://127.0.0.1:7890"
    # - "socks5://user:pass@127.0.0.1:1080"

notify:
  console: true                    # 控制台高亮提醒
  desktop: true                    # 桌面系统通知（无图形环境自动禁用）
  sound: true                      # 系统提示音（beep 或自定义 wav）
  sound-file: ""                   # 可选：提示音 .wav 文件路径
  email:
    enabled: false
    smtp-host: smtp.gmail.com      # Gmail 需使用「应用专用密码」
    smtp-port: 465
    use-ssl: true                  # true=465 隐式 SSL；false=587 STARTTLS
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_USERNAME:}
    to:
      - "your-email@example.com"
    subject: "[在庫通知] iPhone 有货"
  webhook:
    enabled: false
    test-on-startup: false         # 启动时发一条测试消息验证 webhook
    wechat-work: ""                # 企业微信群机器人 Webhook URL
    dingtalk: ""                   # 钉钉机器人 Webhook URL
    feishu: ""                     # 飞书机器人 Webhook URL
    slack: ""                      # Slack Incoming Webhook URL
    discord: ""                    # Discord Webhook URL
    telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
    telegram-chat-id: ${TELEGRAM_CHAT_ID:}
