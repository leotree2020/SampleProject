[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marketcast"
version = "0.1.0"
description = "股票与外汇预测辅助系统：技术指标评分 + 机器学习方向预测 + 回测 + 风控建议"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.67", "plotly>=5.18"]
dev = ["pytest>=7.0"]

[project.scripts]
marketcast = "marketcast.cli:main"

[tool.setuptools.packages.find]
include = ["marketcast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
